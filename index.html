<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone untuk merender JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PIN_CODE = "030427";

        // Definisi Kategori berdasarkan Alokasi
        const ALLOCATION_CATEGORIES = {
            needs: [
                { id: "belanja", name: "Belanja Dapur", icon: "shopping-bag" },
                { id: "tagihan", name: "Tagihan & Utilitas", icon: "file-text" },
                { id: "transport", name: "Transportasi", icon: "car" },
                { id: "kesehatan", name: "Kesehatan", icon: "activity" }
            ],
            wants: [
                { id: "jajan", name: "Jajan & Kuliner", icon: "coffee" },
                { id: "kopi", name: "Kopi & Nongkrong", icon: "smile" },
                { id: "baju", name: "Beli Baju / Gadget", icon: "shopping-cart" },
                { id: "hiburan", name: "Hiburan & Hobi", icon: "tv" }
            ],
            savings: [
                { id: "darurat", name: "Setor Dana Darurat", icon: "shield" },
                { id: "investasi", name: "Investasi / Impian", icon: "trending-up" }
            ]
        };

        function App() {
            // State Utama
            const [isLocked, setIsLocked] = useState(true);
            const [pinInput, setPinInput] = useState("");
            const [pinError, setPinError] = useState(false);
            const [darkMode, setDarkMode] = useState(false);

            // Transaksi & Data
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('fm_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            // Modal & Form State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [transType, setTransType] = useState("expense"); // "income" atau "expense"
            const [formAmount, setFormAmount] = useState("");
            const [formAlloc, setFormAlloc] = useState("needs"); // "needs", "wants", "savings"
            const [formCategory, setFormCategory] = useState(""); // Default Kosong
            const [formNote, setFormNote] = useState("");
            const [isLoading, setIsLoading] = useState(false);

            // Toast State
            const [toastMessage, setToastMessage] = useState("");

            useEffect(() => {
                localStorage.setItem('fm_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Audio Chime Feedback
            const playChime = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {
                    console.log("Audio non-active");
                }
            };

            const triggerToast = (msg) => {
                setToastMessage(msg);
                playChime();
                setTimeout(() => setToastMessage(""), 2500);
            };

            // Handling Virtual Keypad PIN Input
            const handlePinPress = (num) => {
                if (pinInput.length < 6) {
                    const newPin = pinInput + num;
                    setPinInput(newPin);
                    setPinError(false);
                    
                    // Otomatis cek jika sudah 6 digit
                    if (newPin.length === 6) {
                        if (newPin === PIN_CODE) {
                            playChime(); // Suara sukses saat PIN benar
                            setTimeout(() => {
                                setIsLocked(false);
                                setPinInput("");
                                setPinError(false);
                            }, 200);
                        } else {
                            setPinError(true);
                            setTimeout(() => {
                                setPinInput("");
                            }, 300);
                        }
                    }
                }
            };

            const handlePinDelete = () => {
                setPinInput(prev => prev.slice(0, -1));
                setPinError(false);
            };

            const handlePinClear = () => {
                setPinInput("");
                setPinError(false);
            };

            // Formatting Angka
            const formatNumber = (num) => {
                return new Intl.NumberFormat("id-ID").format(num || 0);
            };

            const parseRawNumber = (str) => {
                return parseInt(str.replace(/\D/g, ""), 10) || 0;
            };

            const handleAmountChange = (e) => {
                const raw = parseRawNumber(e.target.value);
                setFormAmount(raw ? formatNumber(raw) : "");
            };

            // Kalkulasi Dompet Saldo
            const totals = useMemo(() => {
                let totalIncome = 0;
                let expNeeds = 0;
                let expWants = 0;
                let expSavings = 0;

                transactions.forEach(t => {
                    if (t.type === 'income') {
                        totalIncome += t.amount;
                    } else {
                        if (t.allocation === 'needs') expNeeds += t.amount;
                        if (t.allocation === 'wants') expWants += t.amount;
                        if (t.allocation === 'savings') expSavings += t.amount;
                    }
                });

                const allocNeedsTotal = totalIncome * 0.50;
                const allocWantsTotal = totalIncome * 0.30;
                const allocSavingsTotal = totalIncome * 0.20;

                const remNeeds = allocNeedsTotal - expNeeds;
                const remWants = allocWantsTotal - expWants;
                const remSavings = allocSavingsTotal - expSavings;

                const totalExpense = expNeeds + expWants + expSavings;
                const remTotal = totalIncome - totalExpense;

                return {
                    totalIncome,
                    totalExpense,
                    remTotal,
                    needs: { total: allocNeedsTotal, used: expNeeds, rem: remNeeds },
                    wants: { total: allocWantsTotal, used: expWants, rem: remWants },
                    savings: { total: allocSavingsTotal, used: expSavings, rem: remSavings }
                };
            }, [transactions]);

            // Handling Simpan Transaksi
            const handleSaveTransaction = (e) => {
                e.preventDefault();
                const numericAmount = parseRawNumber(formAmount);

                if (!numericAmount || numericAmount <= 0) {
                    alert("Masukkan nominal yang valid!");
                    return;
                }

                if (transType === 'expense' && !formCategory) {
                    alert("Silakan pilih kategori pengeluaran terlebih dahulu!");
                    return;
                }

                setIsLoading(true);

                setTimeout(() => {
                    const newTransaction = {
                        id: Date.now().toString(),
                        type: transType,
                        amount: numericAmount,
                        allocation: transType === 'expense' ? formAlloc : null,
                        category: transType === 'expense' ? formCategory : 'gaji',
                        note: formNote || (transType === 'income' ? 'Pemasukan Gajian' : 'Pengeluaran'),
                        date: new Date().toISOString()
                    };

                    setTransactions(prev => [newTransaction, ...prev]);
                    setIsLoading(false);
                    setIsModalOpen(false);

                    // Reset Form
                    setFormAmount("");
                    setFormCategory("");
                    setFormNote("");

                    triggerToast(transType === 'income' ? "Pemasukan berhasil ditambahkan!" : "Pengeluaran berhasil dicatat!");
                }, 1000);
            };

            // Switch Alokasi di Form Modal
            const handleAllocChange = (allocKey) => {
                setFormAlloc(allocKey);
                setFormCategory(""); // Reset kategori agar tidak terpilih otomatis
            };

            useEffect(() => {
                lucide.createIcons();
            });

            if (isLocked) {
                return (
                    <div class="flex items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-gray-950 relative">
                        {/* Tombol Mode Terang/Gelap di Pojok Kanan Atas */}
                        <button 
                            onClick={() => setDarkMode(!darkMode)} 
                            class="absolute top-4 right-4 p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all shadow-sm"
                            title="Ganti Mode"
                        >
                            {darkMode ? <i data-lucide="sun" class="w-5 h-5 text-yellow-400"></i> : <i data-lucide="moon" class="w-5 h-5"></i>}
                        </button>

                        <div class="bg-white dark:bg-gray-900 p-6 sm:p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-gray-100 dark:border-gray-800">
                            <div class="w-12 h-12 bg-brand-100 dark:bg-brand-700/30 text-brand-600 dark:text-brand-500 rounded-full flex items-center justify-center mx-auto mb-2">
                                <i data-lucide="lock" class="w-6 h-6"></i>
                            </div>
                            <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-1">Finance Management</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mb-5">Masukkan PIN keamanan untuk mengakses aplikasi</p>
                            
                            {/* Indikator Titik PIN */}
                            <div class="flex justify-center items-center gap-3 mb-6">
                                {[...Array(6)].map((_, i) => {
                                    const isFilled = i < pinInput.length;
                                    return (
                                        <div 
                                            key={i} 
                                            class={`w-4 h-4 rounded-full transition-all duration-200 ${
                                                isFilled 
                                                    ? 'bg-brand-600 scale-110' 
                                                    : 'border-2 border-gray-300 dark:border-gray-600 bg-transparent'
                                            }`}
                                        ></div>
                                    );
                                })}
                            </div>

                            {pinError && <p class="text-xs text-red-500 mb-4 font-medium animate-shake">PIN salah! Silakan coba lagi.</p>}

                            {/* Custom Web Keypad */}
                            <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
                                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                                    <button
                                        key={num}
                                        type="button"
                                        onClick={() => handlePinPress(num.toString())}
                                        class="h-14 rounded-2xl bg-gray-100 dark:bg-gray-800 hover:bg-brand-50 dark:hover:bg-brand-900/30 text-gray-800 dark:text-white text-xl font-semibold flex items-center justify-center transition-all active:scale-95"
                                    >
                                        {num}
                                    </button>
                                ))}
                                <button
                                    type="button"
                                    onClick={handlePinClear}
                                    class="h-14 rounded-2xl bg-gray-100 dark:bg-gray-800 hover:bg-rose-50 dark:hover:bg-rose-900/30 text-gray-600 dark:text-gray-300 hover:text-rose-600 text-base font-bold flex items-center justify-center transition-all active:scale-95"
                                >
                                    C
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handlePinPress("0")}
                                    class="h-14 rounded-2xl bg-gray-100 dark:bg-gray-800 hover:bg-brand-50 dark:hover:bg-brand-900/30 text-gray-800 dark:text-white text-xl font-semibold flex items-center justify-center transition-all active:scale-95"
                                >
                                    0
                                </button>
                                <button
                                    type="button"
                                    onClick={handlePinDelete}
                                    class="h-14 rounded-2xl bg-gray-100 dark:bg-gray-800 hover:bg-rose-50 dark:hover:bg-rose-900/30 text-gray-600 dark:text-gray-300 hover:text-rose-600 flex items-center justify-center transition-all active:scale-95"
                                >
                                    <i data-lucide="delete" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div class="max-w-4xl mx-auto px-4 py-6">
                    {/* Header */}
                    <header class="flex justify-between items-center mb-6">
                        <div>
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                <i data-lucide="wallet" class="w-6 h-6 text-brand-600"></i>
                                Finance Management
                            </h1>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Atur Anggaran 50/30/20 Secara Otomatis</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button 
                                onClick={() => setIsLocked(true)} 
                                class="p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all"
                                title="Kunci Aplikasi"
                            >
                                <i data-lucide="lock" class="w-5 h-5"></i>
                            </button>
                            <button 
                                onClick={() => setDarkMode(!darkMode)} 
                                class="p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all"
                                title="Ganti Mode"
                            >
                                {darkMode ? <i data-lucide="sun" class="w-5 h-5 text-yellow-400"></i> : <i data-lucide="moon" class="w-5 h-5"></i>}
                            </button>
                        </div>
                    </header>

                    {/* Ringkasan Saldo Utama */}
                    <div class="bg-gradient-to-br from-brand-600 to-brand-700 text-white p-6 rounded-2xl shadow-lg mb-6">
                        <div class="text-xs text-brand-100 uppercase tracking-wider mb-1">Total Sisa Saldo</div>
                        <div class="text-3xl font-extrabold mb-4">Rp {formatNumber(totals.remTotal)}</div>
                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-brand-500/50 text-sm">
                            <div>
                                <span class="text-brand-100 text-xs block">Total Pemasukan</span>
                                <span class="font-semibold text-emerald-300">+ Rp {formatNumber(totals.totalIncome)}</span>
                            </div>
                            <div>
                                <span class="text-brand-100 text-xs block">Total Pengeluaran</span>
                                <span class="font-semibold text-rose-300">- Rp {formatNumber(totals.totalExpense)}</span>
                            </div>
                        </div>
                    </div>

                    {/* Kartu Dompet Alokasi (50/30/20) */}
                    <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">Dompet Alokasi Anggaran</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        {/* 50% Kebutuhan */}
                        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/60 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2.5 py-1 bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-lg">50% Kebutuhan</span>
                                <i data-lucide="shopping-bag" class="w-4 h-4 text-blue-500"></i>
                            </div>
                            <div class="text-lg font-bold text-gray-900 dark:text-white mb-1">Rp {formatNumber(totals.needs.rem)}</div>
                            <div class="text-xs text-gray-400 flex justify-between border-t border-gray-100 dark:border-gray-700 pt-2 mt-2">
                                <span>Target: Rp {formatNumber(totals.needs.total)}</span>
                                <span>Pakai: Rp {formatNumber(totals.needs.used)}</span>
                            </div>
                        </div>

                        {/* 30% Keinginan */}
                        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/60 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2.5 py-1 bg-purple-50 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 rounded-lg">30% Keinginan</span>
                                <i data-lucide="coffee" class="w-4 h-4 text-purple-500"></i>
                            </div>
                            <div class="text-lg font-bold text-gray-900 dark:text-white mb-1">Rp {formatNumber(totals.wants.rem)}</div>
                            <div class="text-xs text-gray-400 flex justify-between border-t border-gray-100 dark:border-gray-700 pt-2 mt-2">
                                <span>Target: Rp {formatNumber(totals.wants.total)}</span>
                                <span>Pakai: Rp {formatNumber(totals.wants.used)}</span>
                            </div>
                        </div>

                        {/* 20% Tabungan */}
                        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-100 dark:border-gray-700/60 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2.5 py-1 bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-lg">20% Tabungan</span>
                                <i data-lucide="shield" class="w-4 h-4 text-emerald-500"></i>
                            </div>
                            <div class="text-lg font-bold text-gray-900 dark:text-white mb-1">Rp {formatNumber(totals.savings.rem)}</div>
                            <div class="text-xs text-gray-400 flex justify-between border-t border-gray-100 dark:border-gray-700 pt-2 mt-2">
                                <span>Target: Rp {formatNumber(totals.savings.total)}</span>
                                <span>Pakai: Rp {formatNumber(totals.savings.used)}</span>
                            </div>
                        </div>
                    </div>

                    {/* Tombol Aksi */}
                    <div class="flex gap-3 mb-6">
                        <button 
                            onClick={() => { setTransType("expense"); setIsModalOpen(true); }}
                            class="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 shadow-sm transition-all"
                        >
                            <i data-lucide="minus-circle" class="w-5 h-5"></i> Catat Pengeluaran
                        </button>
                        <button 
                            onClick={() => { setTransType("income"); setIsModalOpen(true); }}
                            class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 shadow-sm transition-all"
                        >
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> Tambah Gajian
                        </button>
                    </div>

                    {/* Riwayat Transaksi */}
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-100 dark:border-gray-700/60 shadow-sm">
                        <h3 class="font-bold text-gray-900 dark:text-white mb-4">Riwayat Transaksi</h3>
                        {transactions.length === 0 ? (
                            <p class="text-center py-8 text-sm text-gray-400">Belum ada transaksi yang dicatat.</p>
                        ) : (
                            <div class="space-y-3">
                                {transactions.map((t) => (
                                    <div key={t.id} class="flex items-center justify-between p-3 rounded-xl border border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-all">
                                        <div class="flex items-center gap-3">
                                            <div class={`p-2.5 rounded-xl ${t.type === 'income' ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30' : 'bg-rose-100 text-rose-600 dark:bg-rose-900/30'}`}>
                                                <i data-lucide={t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'} class="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <div class="font-semibold text-sm text-gray-900 dark:text-white">{t.note}</div>
                                                <div class="text-xs text-gray-400">
                                                    {new Date(t.date).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })}
                                                    {t.allocation && ` • ${t.allocation === 'needs' ? 'Kebutuhan (50%)' : t.allocation === 'wants' ? 'Keinginan (30%)' : 'Tabungan (20%)'}`}
                                                </div>
                                            </div>
                                        </div>
                                        <div class={`font-bold text-sm ${t.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                                            {t.type === 'income' ? '+' : '-'} Rp {formatNumber(t.amount)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Modal Tambah Transaksi */}
                    {isModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100 dark:border-gray-700">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="font-bold text-lg text-gray-900 dark:text-white">
                                        {transType === 'income' ? 'Tambah Gajian / Pemasukan' : 'Catat Pengeluaran Baru'}
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveTransaction} class="space-y-4">
                                    {/* Input Nominal */}
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase">Nominal (Rp)</label>
                                        <input 
                                            type="text" 
                                            placeholder="0"
                                            value={formAmount}
                                            onChange={handleAmountChange}
                                            class="w-full text-lg font-bold px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500"
                                            required
                                        />
                                    </div>

                                    {/* Jika Pengeluaran: Pilih Dompet Alokasi */}
                                    {transType === 'expense' && (
                                        <>
                                            <div>
                                                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase">Potong Dari Alokasi</label>
                                                <div class="grid grid-cols-3 gap-2">
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleAllocChange('needs')}
                                                        class={`py-2 px-1 text-xs font-medium rounded-xl border transition-all ${formAlloc === 'needs' ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}
                                                    >
                                                        50% Kebutuhan
                                                    </button>
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleAllocChange('wants')}
                                                        class={`py-2 px-1 text-xs font-medium rounded-xl border transition-all ${formAlloc === 'wants' ? 'bg-purple-600 text-white border-purple-600' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}
                                                    >
                                                        30% Keinginan
                                                    </button>
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleAllocChange('savings')}
                                                        class={`py-2 px-1 text-xs font-medium rounded-xl border transition-all ${formAlloc === 'savings' ? 'bg-emerald-600 text-white border-emerald-600' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}
                                                    >
                                                        20% Tabungan
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Pilihan Kategori Terfilter (Tidak Langsung Terpilih) */}
                                            <div>
                                                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase">Pilih Kategori</label>
                                                <div class="grid grid-cols-2 gap-2">
                                                    {ALLOCATION_CATEGORIES[formAlloc].map((cat) => (
                                                        <button 
                                                            type="button"
                                                            key={cat.id}
                                                            onClick={() => setFormCategory(cat.id)}
                                                            class={`p-2.5 text-xs rounded-xl border text-left flex items-center gap-2 transition-all ${formCategory === cat.id ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 font-semibold' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}
                                                        >
                                                            <i data-lucide={cat.icon} class="w-4 h-4"></i>
                                                            {cat.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    {/* Catatan/Keterangan */}
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1 uppercase">Keterangan / Catatan</label>
                                        <input 
                                            type="text" 
                                            placeholder="Contoh: Belanja Bulanan, Kopi, dll"
                                            value={formNote}
                                            onChange={(e) => setFormNote(e.target.value)}
                                            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                        />
                                    </div>

                                    {/* Tombol Simpan */}
                                    <button 
                                        type="submit" 
                                        disabled={isLoading}
                                        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 rounded-xl transition-all flex items-center justify-center gap-2"
                                    >
                                        {isLoading ? "Menyimpan..." : "Simpan Transaksi"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Center Success Toast */}
                    {toastMessage && (
                        <div class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium animate-bounce">
                            <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400 dark:text-emerald-600"></i>
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
