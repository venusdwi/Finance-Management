<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Management - Venus & Hani</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone untuk kompilasi JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
          Wallet, ArrowDownRight, ArrowUpRight, Plus, Trash2, Edit2, 
          PiggyBank, Target, Calendar, User, ShieldAlert, Check, X,
          ShoppingBag, Zap, Car, HeartPulse, Utensils, Coffee, Smartphone, Gift, CreditCard,
          PieChart, DollarSign, Lock, Sun, Moon, Sparkles, RefreshCw, Layers
        } = LucideIcons;

        const CORRECT_PIN = '030427';

        const RpIcon = ({ className = "w-4 h-4" }) => (
          <span className={`font-black text-xs inline-flex items-center justify-center border border-current rounded px-1 leading-none ${className}`}>
            Rp
          </span>
        );

        const EXPENSE_CATEGORIES = [
          { id: 'dapur', label: 'Belanja Dapur', icon: ShoppingBag, color: 'bg-emerald-500', bucket: 'needs' },
          { id: 'tagihan', label: 'Tagihan & Utilitas', icon: Zap, color: 'bg-amber-500', bucket: 'needs' },
          { id: 'transpot', label: 'Transportasi', icon: Car, color: 'bg-blue-500', bucket: 'needs' },
          { id: 'kesehatan', label: 'Kesehatan', icon: HeartPulse, color: 'bg-rose-500', bucket: 'needs' },
          { id: 'jajan', label: 'Jajan & Kuliner', icon: Utensils, color: 'bg-purple-500', bucket: 'wants' },
          { id: 'coffee', label: 'Kopi & Nongkrong', icon: Coffee, color: 'bg-amber-600', bucket: 'wants' },
          { id: 'belanja', label: 'Beli Baju / Gadget', icon: Smartphone, color: 'bg-pink-500', bucket: 'wants' },
          { id: 'hiburan', label: 'Hiburan & Hobi', icon: Gift, color: 'bg-indigo-500', bucket: 'wants' },
          { id: 'danadarurat', label: 'Setor Dana Darurat', icon: PiggyBank, color: 'bg-teal-500', bucket: 'savings' },
          { id: 'investasi', label: 'Investasi / Impian', icon: Target, color: 'bg-cyan-500', bucket: 'savings' },
        ];

        const INCOME_CATEGORIES = [
          { id: 'gaji', label: 'Gaji Utama (Venus)', icon: RpIcon, color: 'bg-indigo-500' },
          { id: 'bonus', label: 'Bonus / Extra Income', icon: CreditCard, color: 'bg-teal-500' },
        ];

        const BUCKET_OPTIONS = [
          { id: 'needs', label: '50% Kebutuhan', color: 'border-emerald-500 text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40' },
          { id: 'wants', label: '30% Keinginan', color: 'border-amber-500 text-amber-500 bg-amber-50 dark:bg-amber-950/40' },
          { id: 'savings', label: '20% Tabungan', color: 'border-indigo-500 text-indigo-500 bg-indigo-50 dark:bg-indigo-950/40' },
        ];

        const formatNumberWithDots = (val) => {
          if (val === null || val === undefined || val === '') return '';
          const cleanStr = String(val).replace(/\D/g, '');
          if (!cleanStr) return '';
          return parseInt(cleanStr, 10).toLocaleString('id-ID');
        };

        const parseRawNumber = (formattedStr) => {
          if (!formattedStr) return 0;
          const cleanStr = String(formattedStr).replace(/\D/g, '');
          return parseInt(cleanStr, 10) || 0;
        };

        const INITIAL_TRANSACTIONS = [];
        const INITIAL_GOALS = [
          { id: '1', title: 'Dana Darurat', target: 15000000, current: 0 },
          { id: '2', title: 'Liburan Keluarga', target: 5000000, current: 0 }
        ];

        function App() {
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [pinInput, setPinInput] = useState('');
          const [pinError, setPinError] = useState(false);

          const [darkMode, setDarkMode] = useState(() => {
            try { return localStorage.getItem('fm_dark_mode') === 'true'; } catch { return false; }
          });

          const [activeUser, setActiveUser] = useState('Venus');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [selectedTxId, setSelectedTxId] = useState(null);
          const [activeBucketDetail, setActiveBucketDetail] = useState(null);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [toastMessage, setToastMessage] = useState(null);
          const [autoSplitModalData, setAutoSplitModalData] = useState(null);

          const [transactions, setTransactions] = useState(() => {
            try {
              const saved = localStorage.getItem('fm_transactions');
              if (saved) {
                const parsed = JSON.parse(saved);
                return parsed.map(t => ({
                  ...t,
                  createdBy: t.createdBy === 'Istri' ? 'Hani' : (t.createdBy === 'Venus (Suami)' ? 'Venus' : t.createdBy)
                }));
              }
              return INITIAL_TRANSACTIONS;
            } catch {
              return INITIAL_TRANSACTIONS;
            }
          });

          const [savingsGoals, setSavingsGoals] = useState(() => {
            try {
              const saved = localStorage.getItem('fm_goals');
              return saved ? JSON.parse(saved) : INITIAL_GOALS;
            } catch {
              return INITIAL_GOALS;
            }
          });

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [editingTx, setEditingTx] = useState(null);
          const [deletingTx, setDeletingTx] = useState(null);

          const [formType, setFormType] = useState('expense');
          const [formAmount, setFormAmount] = useState('');
          const [formCategory, setFormCategory] = useState('');
          const [formBucket, setFormBucket] = useState('needs');
          const [formNotes, setFormNotes] = useState('');

          const [isDepositModalOpen, setIsDepositModalOpen] = useState(false);
          const [selectedGoal, setSelectedGoal] = useState(null);
          const [depositAmount, setDepositAmount] = useState('');

          useEffect(() => {
            try { localStorage.setItem('fm_transactions', JSON.stringify(transactions)); } catch (e) {}
          }, [transactions]);

          useEffect(() => {
            try { localStorage.setItem('fm_goals', JSON.stringify(savingsGoals)); } catch (e) {}
          }, [savingsGoals]);

          useEffect(() => {
            try { localStorage.setItem('fm_dark_mode', darkMode); } catch (e) {}
            if (darkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [darkMode]);

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => { setToastMessage(null); }, 3500);
          };

          const handlePinKeyPress = (digit) => {
            if (pinInput.length < 6) {
              const newPin = pinInput + digit;
              setPinInput(newPin);
              setPinError(false);

              if (newPin.length === 6) {
                if (newPin === CORRECT_PIN) {
                  setTimeout(() => {
                    setIsAuthenticated(true);
                    setPinInput('');
                  }, 150);
                } else {
                  setPinError(true);
                  setTimeout(() => { setPinInput(''); }, 600);
                }
              }
            }
          };

          const handlePinDelete = () => {
            setPinInput(prev => prev.slice(0, -1));
            setPinError(false);
          };

          const handlePinClear = () => {
            setPinInput('');
            setPinError(false);
          };

          const handleAmountInputChange = (e) => {
            setFormAmount(formatNumberWithDots(e.target.value));
          };

          const handleDepositAmountChange = (e) => {
            setDepositAmount(formatNumberWithDots(e.target.value));
          };

          const handleBucketChange = (newBucket) => {
            setFormBucket(newBucket);
            setFormCategory('');
          };

          const currentAvailableCategories = useMemo(() => {
            if (formType === 'income') return INCOME_CATEGORIES;
            return EXPENSE_CATEGORIES.filter(c => c.bucket === formBucket);
          }, [formType, formBucket]);

          const totalIncome = useMemo(() => {
            return transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
          }, [transactions]);

          const totalExpense = useMemo(() => {
            return transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
          }, [transactions]);

          const currentBalance = totalIncome - totalExpense;

          const ruleBreakdown = useMemo(() => {
            let needsIn = 0, wantsIn = 0, savingsIn = 0;
            let needsOut = 0, wantsOut = 0, savingsOut = 0;
            let needsTx = [], wantsTx = [], savingsTx = [];

            transactions.forEach(t => {
              const amt = Number(t.amount || 0);
              if (t.type === 'income') {
                const nInc = Math.round(amt * 0.5);
                const wInc = Math.round(amt * 0.3);
                const sInc = amt - nInc - wInc;
                needsIn += nInc; wantsIn += wInc; savingsIn += sInc;
                needsTx.push({ ...t, allocAmount: nInc, allocType: 'in' });
                wantsTx.push({ ...t, allocAmount: wInc, allocType: 'in' });
                savingsTx.push({ ...t, allocAmount: sInc, allocType: 'in' });
              } else if (t.type === 'expense') {
                let bucket = t.bucketOverride;
                if (!bucket) {
                  const cat = EXPENSE_CATEGORIES.find(c => c.id === t.categoryId);
                  bucket = cat?.bucket || 'needs';
                }
                if (bucket === 'needs') { needsOut += amt; needsTx.push({ ...t, allocAmount: amt, allocType: 'out' }); }
                else if (bucket === 'wants') { wantsOut += amt; wantsTx.push({ ...t, allocAmount: amt, allocType: 'out' }); }
                else if (bucket === 'savings') { savingsOut += amt; savingsTx.push({ ...t, allocAmount: amt, allocType: 'out' }); }
              }
            });

            return {
              needs: { allocatedTotal: needsIn, spentTotal: needsOut, currentBalance: needsIn - needsOut, txs: needsTx },
              wants: { allocatedTotal: wantsIn, spentTotal: wantsOut, currentBalance: wantsIn - wantsOut, txs: wantsTx },
              savings: { allocatedTotal: savingsIn, spentTotal: savingsOut, currentBalance: savingsIn - savingsOut, txs: savingsTx }
            };
          }, [transactions]);

          const categoryExpenses = useMemo(() => {
            const summary = {};
            EXPENSE_CATEGORIES.forEach(cat => { summary[cat.id] = 0; });
            transactions.filter(t => t.type === 'expense').forEach(t => {
              if (summary[t.categoryId] !== undefined) summary[t.categoryId] += Number(t.amount || 0);
              else summary[t.categoryId] = Number(t.amount || 0);
            });
            return summary;
          }, [transactions]);

          const handleSubmitTransaction = (e) => {
            e.preventDefault();
            const rawVal = parseRawNumber(formAmount);
            if (rawVal <= 0 || isSubmitting) return;
            if (!formCategory) { alert('Silakan pilih salah satu kategori.'); return; }

            setIsSubmitting(true);
            setTimeout(() => {
              try {
                if (editingTx) {
                  setTransactions(prev => prev.map(t => t.id === editingTx.id ? {
                    ...t, type: formType, amount: rawVal, categoryId: formCategory,
                    bucketOverride: formType === 'expense' ? formBucket : null,
                    notes: formNotes || (formType === 'income' ? 'Pemasukan' : 'Pengeluaran'),
                  } : t));
                  showToast('Transaksi berhasil diperbarui!');
                } else {
                  const todayStr = new Date().toISOString().split('T')[0];
                  const newTx = {
                    id: Date.now().toString(), type: formType, amount: rawVal,
                    categoryId: formCategory, bucketOverride: formType === 'expense' ? formBucket : null,
                    notes: formNotes || (formType === 'income' ? 'Pemasukan Gaji' : 'Pengeluaran'),
                    date: todayStr, createdBy: activeUser
                  };
                  setTransactions(prev => [newTx, ...prev]);
                  if (formType === 'income') {
                    const needsAmount = Math.round(rawVal * 0.5);
                    const wantsAmount = Math.round(rawVal * 0.3);
                    const savingsAmount = rawVal - needsAmount - wantsAmount;
                    setAutoSplitModalData({ incomeAmount: rawVal, needsAmount, wantsAmount, savingsAmount });
                  } else {
                    const bLabel = BUCKET_OPTIONS.find(b => b.id === formBucket)?.label || '';
                    showToast(`Pengeluaran berhasil dicatat & memotong ${bLabel}!`);
                  }
                }
              } catch (err) { console.error(err); }
              finally { setIsSubmitting(false); closeFormModal(); }
            }, 1000);
          };

          const handleDepositToGoal = (e) => {
            e.preventDefault();
            const rawVal = parseRawNumber(depositAmount);
            if (rawVal <= 0 || !selectedGoal || isSubmitting) return;

            setIsSubmitting(true);
            setTimeout(() => {
              setSavingsGoals(prev => prev.map(g => g.id === selectedGoal.id ? { ...g, current: g.current + rawVal } : g));
              const todayStr = new Date().toISOString().split('T')[0];
              const newTx = {
                id: Date.now().toString(), type: 'expense', amount: rawVal,
                categoryId: 'danadarurat', bucketOverride: 'savings',
                notes: `Setoran ke ${selectedGoal.title}`, date: todayStr, createdBy: activeUser
              };
              setTransactions(prev => [newTx, ...prev]);
              showToast(`Berhasil setor ke ${selectedGoal.title}!`);
              setIsSubmitting(false);
              setIsDepositModalOpen(false);
              setSelectedGoal(null);
              setDepositAmount('');
            }, 1000);
          };

          const openEditModal = (tx) => {
            setEditingTx(tx);
            setFormType(tx.type);
            setFormAmount(formatNumberWithDots(tx.amount));
            setFormCategory(tx.categoryId);
            setFormBucket(tx.bucketOverride || 'needs');
            setFormNotes(tx.notes || '');
            setIsModalOpen(true);
          };

          const confirmDeleteTransaction = () => {
            if (deletingTx) {
              setTransactions(prev => prev.filter(t => t.id !== deletingTx.id));
              setDeletingTx(null);
              showToast('Transaksi berhasil dihapus');
            }
          };

          const closeFormModal = () => {
            setIsModalOpen(false);
            setEditingTx(null);
            setFormAmount('');
            setFormNotes('');
            setFormType('expense');
            setFormCategory('');
            setFormBucket('needs');
            setIsSubmitting(false);
          };

          const formatRupiah = (val) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
          };

          const getCategoryDetails = (id, type) => {
            if (type === 'income') return INCOME_CATEGORIES.find(c => c.id === id) || { label: 'Pemasukan', icon: RpIcon, color: 'bg-indigo-500' };
            return EXPENSE_CATEGORIES.find(c => c.id === id) || { label: 'Pengeluaran', icon: ShoppingBag, color: 'bg-slate-500' };
          };

          if (!isAuthenticated) {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white">
                <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-xl border border-slate-100 dark:border-slate-800 text-center">
                  <div className="mx-auto w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                    <Lock className="w-8 h-8 text-white" />
                  </div>
                  <h2 className="text-xl font-bold mb-1">Finance Management</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">Masukkan PIN 6 Digit (Default: 030427)</p>

                  <div className="flex justify-center gap-3 mb-8">
                    {[0, 1, 2, 3, 4, 5].map((idx) => (
                      <div key={idx} className={`w-4 h-4 rounded-full border-2 transition-all duration-200 ${pinInput.length > idx ? 'bg-indigo-600 border-indigo-600 scale-110 shadow-md' : pinError ? 'border-rose-500 bg-rose-100 animate-bounce' : 'border-slate-300 dark:border-slate-700'}`} />
                    ))}
                  </div>

                  {pinError && <p className="text-xs font-semibold text-rose-500 mb-4">PIN salah! Coba lagi.</p>}

                  <div className="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
                    {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((digit) => (
                      <button key={digit} onClick={() => handlePinKeyPress(digit)} className="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-bold text-xl hover:bg-indigo-50 active:scale-95 transition-all flex items-center justify-center mx-auto">{digit}</button>
                    ))}
                    <button onClick={handlePinClear} className="w-16 h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/50 text-slate-400 font-semibold text-xs flex items-center justify-center mx-auto">HAPUS</button>
                    <button onClick={() => handlePinKeyPress('0')} className="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-bold text-xl flex items-center justify-center mx-auto">0</button>
                    <button onClick={handlePinDelete} className="w-16 h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/50 text-slate-400 font-semibold text-xs flex items-center justify-center mx-auto"><X className="w-5 h-5" /></button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen pb-24 font-sans bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
              {toastMessage && (
                <div className="fixed inset-0 z-[9999] pointer-events-none flex items-center justify-center p-4">
                  <div className="bg-slate-900/90 dark:bg-slate-100/90 text-white dark:text-slate-900 font-bold px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md animate-bounce border border-slate-700/50 pointer-events-auto max-w-sm text-center">
                    <div className="bg-emerald-500 p-1.5 rounded-full text-white shrink-0"><Check className="w-5 h-5" /></div>
                    <span className="text-sm leading-tight">{toastMessage}</span>
                  </div>
                </div>
              )}

              {autoSplitModalData && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="w-full max-w-sm rounded-3xl p-6 shadow-2xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white">
                    <div className="w-12 h-12 bg-indigo-500/10 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-3"><Sparkles className="w-6 h-6" /></div>
                    <h3 className="text-lg font-bold text-center mb-1">Gajian Berhasil Masuk!</h3>
                    <p className="text-xs text-center text-slate-500 dark:text-slate-400 mb-4">Pemasukan <span className="font-bold text-emerald-500">{formatRupiah(autoSplitModalData.incomeAmount)}</span> otomatis dibagi ke 3 dompet:</p>
                    <div className="space-y-2 mb-6">
                      <div className="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 flex justify-between items-center">
                        <div><div className="text-xs font-bold text-emerald-700 dark:text-emerald-400">50% Kebutuhan</div></div>
                        <div className="font-extrabold text-sm text-emerald-600">+{formatRupiah(autoSplitModalData.needsAmount)}</div>
                      </div>
                      <div className="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 flex justify-between items-center">
                        <div><div className="text-xs font-bold text-amber-700 dark:text-amber-400">30% Keinginan</div></div>
                        <div className="font-extrabold text-sm text-amber-600">+{formatRupiah(autoSplitModalData.wantsAmount)}</div>
                      </div>
                      <div className="p-3 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 flex justify-between items-center">
                        <div><div className="text-xs font-bold text-indigo-700 dark:text-indigo-400">20% Tabungan</div></div>
                        <div className="font-extrabold text-sm text-indigo-600">+{formatRupiah(autoSplitModalData.savingsAmount)}</div>
                      </div>
                    </div>
                    <button onClick={() => { setAutoSplitModalData(null); showToast('Alokasi otomatis disimpan!'); }} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm">Mengerti & Lanjutkan</button>
                  </div>
                </div>
              )}

              <header className="sticky top-0 z-30 border-b backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-slate-200 dark:border-slate-800">
                <div className="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="p-2 bg-indigo-600 text-white rounded-xl shadow-md"><Wallet className="w-5 h-5" /></div>
                    <div>
                      <h1 className="text-sm font-bold leading-none">Finance Management</h1>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Venus & Hani</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                      <button onClick={() => setActiveUser('Venus')} className={`px-2.5 py-1 text-xs font-bold rounded-lg ${activeUser === 'Venus' ? 'bg-white dark:bg-slate-700 text-indigo-600 shadow-sm' : 'text-slate-500'}`}>Venus</button>
                      <button onClick={() => setActiveUser('Hani')} className={`px-2.5 py-1 text-xs font-bold rounded-lg ${activeUser === 'Hani' ? 'bg-white dark:bg-slate-700 text-purple-600 shadow-sm' : 'text-slate-500'}`}>Hani</button>
                    </div>
                    <button onClick={() => { setIsAuthenticated(false); setPinInput(''); }} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-rose-500"><Lock className="w-4 h-4" /></button>
                    <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {darkMode ? <Sun className="w-4 h-4 text-amber-400" /> : <Moon className="w-4 h-4 text-slate-700" />}
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-md mx-auto px-4 pt-4 space-y-4">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 p-6 text-white shadow-xl">
                  <div className="absolute top-0 right-0 -mr-6 -mt-6 w-32 h-32 rounded-full bg-white/10 blur-2xl pointer-events-none" />
                  <div className="relative z-10">
                    <span className="text-xs font-semibold text-indigo-200 tracking-wide uppercase">Sisa Total Saldo Aktif</span>
                    <div className="text-3xl font-extrabold tracking-tight mb-4">{formatRupiah(currentBalance)}</div>
                    <div className="grid grid-cols-2 gap-2 pt-3 border-t border-white/15">
                      <div className="flex items-center gap-2">
                        <div className="p-1.5 rounded-lg bg-emerald-500/20 text-emerald-300"><ArrowDownRight className="w-4 h-4" /></div>
                        <div>
                          <div className="text-[10px] text-indigo-200">Pemasukan</div>
                          <div className="text-xs font-bold">{formatRupiah(totalIncome)}</div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="p-1.5 rounded-lg bg-rose-500/20 text-rose-300"><ArrowUpRight className="w-4 h-4" /></div>
                        <div>
                          <div className="text-[10px] text-indigo-200">Pengeluaran</div>
                          <div className="text-xs font-bold">{formatRupiah(totalExpense)}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider">3 Dompet Saldo Alokasi</h2>
                    <span className="text-[10px] text-indigo-500 font-semibold">Klik untuk rincian</span>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => setActiveBucketDetail('needs')} className="p-3 rounded-2xl border text-left bg-white dark:bg-slate-900 border-emerald-200 dark:border-emerald-900 shadow-sm">
                      <div className="text-[10px] font-extrabold text-emerald-600 uppercase mb-1">50% Kebutuhan</div>
                      <div className="text-xs font-black truncate">{formatRupiah(ruleBreakdown.needs.currentBalance)}</div>
                    </button>
                    <button onClick={() => setActiveBucketDetail('wants')} className="p-3 rounded-2xl border text-left bg-white dark:bg-slate-900 border-amber-200 dark:border-amber-900 shadow-sm">
                      <div className="text-[10px] font-extrabold text-amber-600 uppercase mb-1">30% Keinginan</div>
                      <div className="text-xs font-black truncate">{formatRupiah(ruleBreakdown.wants.currentBalance)}</div>
                    </button>
                    <button onClick={() => setActiveBucketDetail('savings')} className="p-3 rounded-2xl border text-left bg-white dark:bg-slate-900 border-indigo-200 dark:border-indigo-900 shadow-sm">
                      <div className="text-[10px] font-extrabold text-indigo-600 uppercase mb-1">20% Tabungan</div>
                      <div className="text-xs font-black truncate">{formatRupiah(ruleBreakdown.savings.currentBalance)}</div>
                    </button>
                  </div>
                </div>

                {activeTab === 'dashboard' && (
                  <div className="space-y-4">
                    <button onClick={() => setIsModalOpen(true)} className="w-full py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2">
                      <Plus className="w-5 h-5" /> Tambah Transaksi Baru
                    </button>

                    <div className="p-4 rounded-3xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 shadow-sm">
                      <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Pengeluaran Per Kategori</h2>
                      <div className="grid grid-cols-2 gap-2">
                        {EXPENSE_CATEGORIES.map(cat => {
                          const Icon = cat.icon;
                          const amt = categoryExpenses[cat.id] || 0;
                          return (
                            <div key={cat.id} className="p-2.5 rounded-2xl border flex items-center gap-2.5 bg-slate-50 dark:bg-slate-950 border-slate-100 dark:border-slate-800">
                              <div className={`p-2 rounded-xl text-white ${cat.color}`}><Icon className="w-4 h-4" /></div>
                              <div className="min-w-0">
                                <div className="text-[11px] font-semibold text-slate-500 truncate">{cat.label}</div>
                                <div className="text-xs font-extrabold truncate">{formatRupiah(amt)}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'transactions' && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Riwayat Transaksi</h2>
                      <button onClick={() => setIsModalOpen(true)} className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> Tambah</button>
                    </div>
                    {transactions.length === 0 ? (
                      <div className="p-8 rounded-3xl text-center border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-400">
                        <Wallet className="w-10 h-10 mx-auto mb-2 opacity-40" />
                        <p className="text-xs font-semibold">Belum ada transaksi</p>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {transactions.map(tx => {
                          const cat = getCategoryDetails(tx.categoryId, tx.type);
                          const Icon = cat.icon;
                          return (
                            <div key={tx.id} className="p-3.5 rounded-2xl border flex items-center justify-between bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800">
                              <div className="flex items-center gap-3 min-w-0">
                                <div className={`p-2.5 rounded-xl text-white ${cat.color}`}><Icon className="w-4 h-4" /></div>
                                <div className="min-w-0">
                                  <div className="text-xs font-bold truncate">{tx.notes || cat.label}</div>
                                  <div className="flex items-center gap-2 mt-0.5">
                                    <span className="text-[10px] text-slate-400">{tx.date}</span>
                                    <span className="text-[9px] px-1.5 py-0.2 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold">{tx.createdBy}</span>
                                  </div>
                                </div>
                              </div>
                              <div className="flex items-center gap-2">
                                <div className={`text-xs font-black ${tx.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}`}>{tx.type === 'income' ? '+' : '-'}{formatRupiah(tx.amount)}</div>
                                <button onClick={() => openEditModal(tx)} className="p-1.5 text-slate-400 hover:text-indigo-500"><Edit2 className="w-3.5 h-3.5" /></button>
                                <button onClick={() => setDeletingTx(tx)} className="p-1.5 text-slate-400 hover:text-rose-500"><Trash2 className="w-3.5 h-3.5" /></button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'goals' && (
                  <div className="space-y-3">
                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Target Tabungan</h2>
                    {savingsGoals.map(goal => {
                      const pct = Math.min(100, Math.round((goal.current / goal.target) * 100));
                      return (
                        <div key={goal.id} className="p-4 rounded-3xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <h3 className="text-sm font-bold">{goal.title}</h3>
                              <p className="text-[11px] text-slate-400">Target: {formatRupiah(goal.target)}</p>
                            </div>
                            <span className="px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-xs font-black">{pct}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${pct}%` }} />
                          </div>
                          <div className="flex justify-between items-center pt-1">
                            <div>
                              <div className="text-[10px] text-slate-400">Terkumpul</div>
                              <div className="text-sm font-black text-emerald-500">{formatRupiah(goal.current)}</div>
                            </div>
                            <button onClick={() => { setSelectedGoal(goal); setIsDepositModalOpen(true); }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Setor</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </main>

              {activeBucketDetail && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="w-full max-w-md max-h-[85vh] flex flex-col rounded-3xl shadow-2xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white">
                    <div className="p-4 border-b dark:border-slate-800 flex items-center justify-between">
                      <h3 className="text-sm font-bold">Rincian Dompet Alokasi</h3>
                      <button onClick={() => setActiveBucketDetail(null)}><X className="w-5 h-5" /></button>
                    </div>
                    <div className="p-4 overflow-y-auto space-y-3 flex-1">
                      {ruleBreakdown[activeBucketDetail].txs.length === 0 ? (
                        <div className="text-center py-8 text-xs text-slate-400">Belum ada aktivitas</div>
                      ) : (
                        ruleBreakdown[activeBucketDetail].txs.map((tx, idx) => {
                          const cat = getCategoryDetails(tx.categoryId, tx.type);
                          const Icon = cat.icon;
                          const isIn = tx.allocType === 'in';
                          return (
                            <div key={idx} className="p-3 rounded-2xl border flex items-center justify-between bg-slate-50 dark:bg-slate-950 border-slate-100 dark:border-slate-800">
                              <div className="flex items-center gap-2.5">
                                <div className={`p-2 rounded-xl text-white ${isIn ? 'bg-emerald-500' : cat.color}`}><Icon className="w-3.5 h-3.5" /></div>
                                <div>
                                  <div className="text-xs font-bold">{isIn ? 'Alokasi Pemasukan' : (tx.notes || cat.label)}</div>
                                  <div className="text-[10px] text-slate-400">{tx.date}</div>
                                </div>
                              </div>
                              <div className={`text-xs font-extrabold ${isIn ? 'text-emerald-500' : 'text-rose-500'}`}>{isIn ? '+' : '-'}{formatRupiah(tx.allocAmount)}</div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>
              )}

              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="w-full max-w-sm rounded-3xl p-5 shadow-2xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="text-base font-bold">{editingTx ? 'Edit Transaksi' : 'Tambah Transaksi'}</h3>
                      <button onClick={closeFormModal}><X className="w-5 h-5" /></button>
                    </div>
                    <form onSubmit={handleSubmitTransaction} className="space-y-4">
                      <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                        <button type="button" onClick={() => { setFormType('expense'); handleBucketChange('needs'); }} className={`py-2 rounded-lg text-xs font-bold ${formType === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-500'}`}>Pengeluaran</button>
                        <button type="button" onClick={() => { setFormType('income'); setFormCategory(''); }} className={`py-2 rounded-lg text-xs font-bold ${formType === 'income' ? 'bg-emerald-500 text-white' : 'text-slate-500'}`}>Pemasukan</button>
                      </div>

                      {formType === 'expense' && (
                        <div>
                          <label className="block text-[11px] font-bold text-slate-400 uppercase mb-2">1. Pilih Alokasi Dompet</label>
                          <div className="grid grid-cols-3 gap-2">
                            {BUCKET_OPTIONS.map(b => (
                              <button key={b.id} type="button" onClick={() => handleBucketChange(b.id)} className={`py-2.5 px-1.5 rounded-xl border text-[11px] font-bold ${formBucket === b.id ? `${b.color} border-2` : 'bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600'}`}>{b.label}</button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div>
                        <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nominal (Rp)</label>
                        <input type="text" inputMode="numeric" placeholder="0" value={formAmount} onChange={handleAmountInputChange} className="w-full px-4 py-3 rounded-xl border font-bold text-lg bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800" required />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-400 uppercase mb-2">2. Pilih Kategori</label>
                        <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
                          {currentAvailableCategories.map(cat => {
                            const Icon = cat.icon;
                            return (
                              <button key={cat.id} type="button" onClick={() => setFormCategory(cat.id)} className={`flex items-center gap-2 p-2.5 rounded-xl border text-xs font-medium text-left ${formCategory === cat.id ? 'bg-indigo-600 text-white border-indigo-600 font-bold' : 'bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300'}`}>
                                <div className={`p-1.5 rounded-lg ${formCategory === cat.id ? 'bg-white/20 text-white' : `${cat.color} text-white`}`}><Icon className="w-3.5 h-3.5" /></div>
                                <span className="truncate">{cat.label}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Catatan</label>
                        <input type="text" placeholder="Keterangan..." value={formNotes} onChange={(e) => setFormNotes(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800" />
                      </div>

                      <button type="submit" disabled={isSubmitting} className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg text-sm flex items-center justify-center gap-2">
                        {isSubmitting ? <RefreshCw className="w-4 h-4 animate-spin" /> : 'Simpan Transaksi'}
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {isDepositModalOpen && selectedGoal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="w-full max-w-sm rounded-3xl p-5 shadow-2xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white">
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h3 className="text-base font-bold">Setor Tabungan</h3>
                        <p className="text-xs text-indigo-500 font-semibold">{selectedGoal.title}</p>
                      </div>
                      <button onClick={() => setIsDepositModalOpen(false)}><X className="w-5 h-5" /></button>
                    </div>
                    <form onSubmit={handleDepositToGoal} className="space-y-4">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nominal (Rp)</label>
                        <input type="text" inputMode="numeric" placeholder="0" value={depositAmount} onChange={handleDepositAmountChange} className="w-full px-4 py-3 rounded-xl border font-bold text-lg bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800" required />
                      </div>
                      <button type="submit" disabled={isSubmitting} className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl text-sm">Konfirmasi Setoran</button>
                    </form>
                  </div>
                </div>
              )}

              {deletingTx && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="w-full max-w-sm rounded-3xl p-5 shadow-2xl border text-center bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-900 dark:text-white">
                    <h3 className="text-base font-bold mb-1">Hapus Transaksi?</h3>
                    <div className="grid grid-cols-2 gap-2 mt-4">
                      <button onClick={() => setDeletingTx(null)} className="py-2.5 rounded-xl border font-bold text-xs">Batal</button>
                      <button onClick={confirmDeleteTransaction} className="py-2.5 rounded-xl bg-rose-500 text-white font-bold text-xs">Hapus</button>
                    </div>
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 right-0 z-40 border-t backdrop-blur-md bg-white/90 dark:bg-slate-900/90 border-slate-200 dark:border-slate-800">
                <div className="max-w-md mx-auto px-6 py-2 flex items-center justify-around">
                  <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
                    <PieChart className="w-5 h-5" /><span className="text-[10px]">Ringkasan</span>
                  </button>
                  <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center gap-1 ${activeTab === 'transactions' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
                    <Layers className="w-5 h-5" /><span className="text-[10px]">Transaksi</span>
                  </button>
                  <button onClick={() => setActiveTab('goals')} className={`flex flex-col items-center gap-1 ${activeTab === 'goals' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}`}>
                    <Target className="w-5 h-5" /><span className="text-[10px]">Tabungan</span>
                  </button>
                </div>
              </nav>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
